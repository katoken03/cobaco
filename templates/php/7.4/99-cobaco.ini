; cobaco: この PHP バージョンの全 FPM プールに共通する設定。
; apply-php-fpm-ini.sh / setup.sh が /etc/php/<ver>/fpm/conf.d/99-cobaco.ini へコピーする。
; パッケージの php.ini よりこちらが優先される。php.ini 自体は編集しない。
; サイトごとの差分は domains.yml の php_settings から
; /var/www/<domain>/conf/php-fpm.conf に出る。

; cobaco FPM defaults — 2026-03-24 session.upload_progress 無効化（PHP 脆弱性対応）
[Session]
session.upload_progress.enabled = 0
