# cobaco catch-all: どの server_name にも一致しない Host / SNI を拒否する
# configure-nginx-default.sh が /etc/nginx/sites-available/cobaco-default に配置する
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/default-catchall-access.log;
    error_log  /var/log/nginx/default-catchall-error.log;

    # レスポンスを返さずに接続を閉じる
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    access_log /var/log/nginx/default-catchall-access.log;
    error_log  /var/log/nginx/default-catchall-error.log;

    # 証明書を送らずに TLS ハンドシェイクを拒否する (nginx 1.19.4+)
    ssl_reject_handshake on;
}
